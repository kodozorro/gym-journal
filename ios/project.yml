# Проект Xcode для приложений на Swift: iPhone и Apple Watch. Сам проект в репозитории не лежит:
# его делает XcodeGen.
#
#   cd ios && xcodegen generate && open GymJournal.xcodeproj
#
# Команда разработчика для подписи задаётся в Config/Local.xcconfig (см. Local.xcconfig.example).

name: GymJournal

options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic

packages:
  # общая логика телефона и часов: журнал, план, очередь записей, обмен с таблицей
  GymJournalCore:
    path: Core

targets:
  GymJournal:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # фотографии тренажёров общие с веб-приложением: в приложение папка попадает целиком
      - path: ../img/machines
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: GymJournal
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/GymJournal.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GymJournalCore
      # приложение для часов едет внутри приложения для iPhone и ставится на часы вместе с ним
      - target: GymJournalWatch
    scheme: {}

  GymJournalWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: GymJournalWatch
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/GymJournalWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - package: GymJournalCore
    scheme: {}
